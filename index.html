<!DOCTYPE html>

<head>
    <link rel="stylesheet" href="assets/main.css">
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <style>
    .page-grid { background-color: #f2f3f4; }
    .paper .page-grid { background-color: #e8e6df; }
    .dark .page-grid { background-color: #242529; }

    .article h1, .article h2 { font-family: Lexend,Lora,serif!important; font-weight:600; }
    .yt-gallery { justify-content: left; }

    /* for unique page elements */
    .links-area { line-height: 1.3; display: flex; gap: 30px; }
        .links-area div > div { padding-right: 10px; }
        .links-area div > div + div { padding-top: 15px; }
            .links-area .inline-icon { margin-right: 5px; }
            .links-area .inline-icon + span { }
            .links-area p { font-family: var(--ff-ui); max-width: 150px; font-size: 90%; color: var(--grey-9); }
    .link-icon::after { display: block; content: ""; background-image: var(--link-icon); border-radius: 2px; width: 16px; height: 16px; margin-inline: 2px; display: inline-block; vertical-align: sub; object-fit: contain; background-repeat: no-repeat; background-size: contain; background-position: center; }

    #page-index { }
        #page-index > div { gap: 6px; line-height: 1; padding: 11px 10px 13px; border-top: 1px dashed var(--grey-a); display: flex; flex-direction: column; }
        #page-index > div:hover { background-color: var(--bg-light-blue-subtle); }
            #page-index > div > div:nth-child(1) { gap: 5rem; line-height: 1.3; display: flex; justify-content: space-between; }
                #page-index > div > div:nth-child(1) a { }
                #page-index > div > div:nth-child(1) .entry-date { color: var(--grey-6); font-family: var(--ff-ui) !important; font-size: var(--fs-article-2); }
            #page-index > div > div:nth-child(2) { display: flex; gap: 6px; color: var(--grey-8); font-family: var(--ff-ui); font-size: var(--fs-article-3); }
                #page-index > div > div:nth-child(2) a { margin-left: 3px; white-space: nowrap; display: flex; align-items: center; color: var(--grey-6); }
                #page-index > div > div:nth-child(2) a .inline-icon { margin-right: 4px; }

    </style>
</head>
