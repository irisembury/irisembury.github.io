<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="assets/main.css">
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <style>
    
    body { --main-width: 700px; }
    html.indent-text .article .auto-list p { text-indent: 0 !important; }
    
    .article a { text-decoration: none; }
    .article h1 { margin: 0 !important; font-size: 32px; font-family: 'Lora','Georgia','Inter',sans-serif; text-align: center; }
    
    .video-index { display: grid; gap: 8px; grid-template-columns: repeat(3, 1fr); font-family: var(--ff-aux-2); margin-top: 10px !important; }
        .video-index :nth-child(n + 4) { display: none; }
        .video-index figure { max-width: 300px; display: flex; flex-direction: column; align-items: stretch; }
            .video-index img { box-sizing: border-box; border: 1px solid var(--theme-grey-c); aspect-ratio: 1.8; object-fit: cover; }
            .video-index img:hover { filter: brightness(1.05); }
            .video-index figcaption { text-align: center; padding: 3px; }
                .video-index figcaption .video-date { color: var(--theme-grey-6); }
    
    .page-index { margin-inline: auto; }
    .page-index * { line-height: 1.3 !important; }
        .page-index li + li { margin-top: 19px !important; }
            .page-index li p { margin-top: 0; }
                .page-index .entry { }
                .page-index .date { color: var(--theme-grey-3); font-family: var(--ff-aux-1); font-size: calc(1em - 1px); }
                .page-index .preview { margin-top: 7px; margin-left: 10px; padding-left: 1em; border-left: 1px solid var(--theme-grey-a); color: var(--theme-grey-3); font-size: calc(1em - 1px); color: var(--theme-grey-4); }
                .page-index .mirrors { margin-top: 6px; display: flex; gap: 7px; }
                    .page-index .mirrors a { color: var(--theme-grey-3); display: inline-flex; align-items: center; }
    </style>
</head>
<body>

//
<div>
    <h1 class="index-title">Iris Embury</h1>
    <div class="social-icons label-external">
        <div><a title="YouTube" href="https://youtube.com/channel/UCXadODjAtT72eYW6xCGyuUA/videos"><span class="youtube-logo inline-icon"></span>YouTube</a></div>
        <div><a title="Twitter/X" href="https://twitter.com/irisembury"><span class="twitter-logo inline-icon"></span>Twitter</a></div>
        <div><a title="Tumblr" href="https://irisembury.tumblr.com/"><span class="tumblr-logo inline-icon"></span>Tumblr</a></div>
        <div><a title="Substack" href="https://irisembury.substack.com/archive"><span class="substack-logo inline-icon"></span>Substack</a></div>
        <div><a title="Bluesky" href="https://bsky.app/profile/irisembury.bsky.social"><span class="bluesky-logo inline-icon"></span>Bluesky</a></div>
        <div><a title="Discord" href="https://discord.gg/fGdV7x5dk2"><span class="discord-logo inline-icon"></span>Discord</a></div>
        <div><a title="Patreon" href="https://www.patreon.com/irisembury"><span class="patreon-logo inline-icon"></span>Patreon</a></div>
    </div>
</div>
