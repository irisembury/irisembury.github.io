<!DOCTYPE html>
<html lang="en" class="label-external">
<head>
    <link rel="stylesheet" href="assets/main.css">
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <style>
    .page-grid { background-color: #f2f3f4; }
    .paper .page-grid { background-color: #e8e6df; }
    .dark .page-grid { background-color: #242529; }

    .article { display: flex; flex-direction: column; align-items: center; }
    .article h1, .article h2 { font-family: Lora, Georgia, sans-serif !important; }

    #videos-index,
    #videos-index + div { min-width: 648px; }
    #page-index { min-width: 632px; }

    /* for unique page elements */
    .links-area { line-height: 1.3; display: flex; gap: 30px; }
        .links-area div > div { padding-right: 10px; }
        .links-area div > div + div { padding-top: 15px; }
            .links-area .inline-icon { margin-right: 5px; }
            .links-area .inline-icon + span { font-family: Inter,Roboto,var(--ff-ui); }
            .links-area p { font-family: var(--ff-ui); max-width: 150px; font-size: 90%; color: var(--grey-9); }
    .link-icon::after { display: block; content: ""; background-image: var(--link-icon); border-radius: 2px; width: 16px; height: 16px; margin-inline: 2px; display: inline-block; vertical-align: sub; object-fit: contain; background-repeat: no-repeat; background-size: contain; background-position: center; }

    #page-index > div { line-height: 1.15; padding: 12px 10px 13px; border-top: 1px dashed var(--grey-a); display: flex; flex-direction: column; gap: 5px; }
    #page-index > div:hover { background-color: var(--bg-light-blue-subtle); }
        .entry-main { display: flex; justify-content: space-between; gap: 1rem; }
            .entry-main a { font-family: Lexend, Inter, sans-serif !important; }
            .entry-date { color: var(--grey-4); font-size: var(--fs-article-2); font-size: 16px; letter-spacing: 0.5px; }
        .entry-under { display: flex; gap: 6px; color: var(--grey-8); font-family: var(--ff-ui); font-size: var(--fs-article-3); }
            .entry-under a { margin-left: 5px; margin-top: 1px; line-height: 1; white-space: nowrap; display: flex; align-items: center; color: var(--grey-6); }
            .entry-under .inline-icon { margin-right: 4px; }

    </style>
</head>
