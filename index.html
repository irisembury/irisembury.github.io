<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="assets/main.css">
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <style>
    body {
    }
    .main-container {
        max-width: var(--main-width) !important; /* disables full-width toggle */
    }
    .mh-top { display: none; }

    .article h1.index-title { font-family: IBM Plex Serif,Inter,sans-serif; font-size: 44px; margin: 0; line-height: 1; }
    
    .social-icons { padding-bottom: 4px; border-bottom: 1px solid var(--theme-grey-c); font-size: 16px; margin: 1em 0; display: flex; justify-content: space-between; flex-wrap: wrap; gap: 0 1rem; font-family: var(--ff-aux-1); }
        .social-icons a { padding-inline: 3px; }
            .social-icons .inline-icon { margin-inline: 0 4px; }

    .content-div { gap: 44px; margin-top: 36px; line-height: 1; font-size: 16px; font-family: var(--ff-aux-1); display: flex; justify-content: center; align-items: stretch; max-width: var(--main-width); margin-inline: auto; }
        .section-top { margin-bottom: 2px; align-items: center; display: flex; justify-content: space-between; }
            .section-top h3 { margin: 0; }
            .section-top a { color: var(--theme-grey-6); }

    .page-index { width: 100%; }
        .page-entry { padding: 8px 8px; margin-inline: -8px; }
        .page-entry:hover { background-color: var(--bg-light-blue-subtle); }
        .page-entry > * + * { margin-top: 5px; }
        .page-entry .page-date { }
        .page-entry .page-mirrors { }
            .page-entry .page-mirrors a { display: inline-flex; padding: 3px; border: 1px solid var(--theme-grey-c); border-radius: 3px; background-color: var(--page-bg); }
                .page-entry .page-mirrors a .link-text { display: none; }
                .page-entry .page-mirrors a .inline-icon { margin: 0; padding: 1px 1px 0; }

    </style>
</head>
<body>
<div>
    <h1 class="index-title">Iris Embury</h1>
    <div class="social-icons label-external">
        <div><a title="YouTube" href="https://youtube.com/channel/UCXadODjAtT72eYW6xCGyuUA/videos"><span class="youtube-logo inline-icon"></span>YouTube</a></div>
        <div><a title="Twitter/X" href="https://twitter.com/irisembury"><span class="twitter-logo inline-icon"></span>Twitter</a></div>
        <div><a title="Tumblr" href="https://irisembury.tumblr.com/"><span class="tumblr-logo inline-icon"></span>Tumblr</a></div>
        <div><a title="Substack" href="https://irisembury.substack.com/archive"><span class="substack-logo inline-icon"></span>Substack</a></div>
        <div><a title="Bluesky" href="https://bsky.app/profile/irisembury.bsky.social"><span class="bluesky-logo inline-icon"></span>Bluesky</a></div>
        <div><a title="Discord" href="https://discord.gg/fGdV7x5dk2"><span class="discord-logo inline-icon"></span>Discord</a></div>
        <div><a title="Patreon" href="https://www.patreon.com/irisembury"><span class="patreon-logo inline-icon"></span>Patreon</a></div>
    </div>
</div>

<div class="content-div">
    <div class="video-index label-external">
        <div class="section-top">
            <h3>Recent videos</h3>
            <a title="See all videos on YouTube" href="https://youtube.com/channel/UCXadODjAtT72eYW6xCGyuUA/videos">see all<span class="inline-icon link-icon"></span></a>
        </div>
    </div>
    <div class="page-index label-external">
