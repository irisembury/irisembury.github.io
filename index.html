<!DOCTYPE html>
<html style="opacity:0">
<head>
    <style>
    .profile-top { line-height: 1.3; display: flex; align-items: center; gap: 13px; padding: 8px;  }
        .profile-img { background-image: url(assets/pfp.jpg); background-size: contain; width: 150px; height: 180px; aspect-ratio: 5 / 6; background-color: grey; border: 1px solid var(--grey-9); }
        .profile-top p { margin-block: 0.5em; margin-left: 2px; }
        
    #container > section { display: none; }
        .tabs { border-bottom: 1px solid var(--grey-c); padding-bottom: 2px; display: flex; align-items: flex-start; margin-bottom: 14px; justify-content: center; gap: 20px; font-family: 'Roboto',sans-serif; font-size: 17px; }
            .tab { color: var(--grey-5); text-align: center; padding: 4px 5px; }
                .dummy { width: 100%; font-weight: 700; visibility: hidden; height: 0; }
        #container.recent .recent { display: block; } #container.recent .tab.recent { color: var(--grey-2); font-weight: 700; }
        #container.videos .videos { display: block; } #container.videos .tab.videos { color: var(--grey-2); font-weight: 700; }
        #container.text .text { display: block; } #container.text .tab.text { color: var(--grey-2); font-weight: 700; }
        
        #container p { line-height: 1.4; color: var(--grey-7); text-align: center; margin-block: 1em; }
        
        .video-index { display: grid; gap: 8px; grid-template-columns: repeat(4, 1fr); font-family: system-ui; }
            .video-index figure { max-width: 300px; display: flex; flex-direction: column; align-items: stretch; }
                .video-index img { width: 100%; height: 100%; box-sizing: border-box; border: 1px solid var(--grey-c); object-fit: cover; }
                .video-index .timecard { width: calc(100% - 2px); margin-inline: auto; text-align: right; height: 18px; margin-bottom: -18px; transform: translate(-2px,-21px); line-height: 1; display: flex; justify-content: flex-end; }
                    .video-index .timecard div { border-radius: 4px; color: #ccc; background-color: #0009; padding: 1px 4px; font-size: 14px; }
                .video-index figcaption { line-height: 1.1 !important; font-size: 17px; padding: 5px 3px; font-family: 'Roboto',sans-serif; }
                    .video-index figcaption > div + div { margin-top: 0.25em; }
                    .video-index .video-title { color: var(--grey-2); }
                    .video-index .video-date { color: var(--grey-7); }
        
        .page-index { gap: 10px; display: grid; grid-template-columns: auto; line-height: 1.4; }
            .page-index > div { border: 1px solid var(--grey-c); padding: 5px 10px 4px; }
            .page-index > div:hover { background-color: var(--grey-f); }
                .page-index .page-title { font-family: 'Roboto',sans-serif; font-size: 18px; }
                .page-index .date { font-family: 'Roboto',system-ui; color: var(--grey-6); }
                .page-index .mirrors { margin-left: 5px; }
                    .page-index .mirrors a + a { margin-left: 3px; }
                    .page-index .mirrors a:hover {  }
                        .page-index .mirrors a .inline-icon { }
                        .page-index .mirrors a .link-text { display: none; color: var(--grey-3); }
    
    </style>
</head>
<body>

<div class="profile-top">
    <div class="profile-img"></div>
    <div>
        <h1>Iris Embury</h1>
        <p>Liberal traditionalist against misinformation and extremism. Not associated with any other person or organization.</p>
    </div>
</div>
<div id="container" class="recent">
    <div class="tabs">
        <div class="no-select pseudo-link recent tab" onclick="setTab('recent')"><div>Recent</div><div class="dummy"></div></div>
        <div class="no-select pseudo-link text tab" onclick="setTab('text')"><div>Text</div><div class="dummy"></div></div>
        <div class="no-select pseudo-link videos tab" onclick="setTab('videos')"><div>Videos</div><div class="dummy"></div></div>
    </div>
    <section class="recent">
        <div class="recent-index">
        I'm redesigning some of this. Placeholder text. See other tabs.
        </div>
    </section>
    <section class="videos">
        <p>I use Patreon as an alternate content host. The content there is not paywalled.</p>
        <div class="video-index"></div>
    </section>
    <section class="text">
        <div class="page-index"></div>
    </section>
    <section class="about">
    </section>
</div>

<script src="assets/layout.js"></script>
<script>
function setTab(x) {
    document.getElementById('container').className = x;
}
Array.from(document.querySelectorAll('.dummy')).forEach(x => x.innerHTML=x.previousElementSibling.innerHTML);
</script>
</body></html>
