    /* This is a 'special' page and ergo has much more styling than usual. */
    .page-grid { background-color: #f4f5f6; }
    .paper .page-grid { background-color: #e8e6df; }
    .dark .page-grid { background-color: #242529; }

    /* for unique page elements */
    .links-area { line-height: 1.3; display: flex; gap: 30px;  }
        .links-area section { padding-left: 15px; display: flex; flex-direction: column; gap: 15px; }
            .links-area .inline-icon { margin-right: 4px; }
            .links-area p { font-family: var(--ff-ui); margin-left: 22px; max-width: 150px; font-size: 90%; color: var(--grey-9); }

    #page-index { max-height: 600px; overflow-y: scroll; margin-bottom: 2em; line-height: 1.3; }
        #page-index > div { display: flex; align-items: baseline; gap: 4px; padding: 10px 0 9px; }
        #page-index > div:nth-child(n + 2) { border-top: 1px dashed var(--grey-c); }
            #page-index .entry-info { display: flex; gap: 3px; color: var(--grey-5); font-size: var(--fs-article-3); }
                #page-index .entry-info a { border: 1px solid var(--grey-e); padding: 3px 5px 3px 2px; line-height: 1; white-space: nowrap; text-decoration: none; }
                #page-index .entry-info a + a { margin-left: 2px; }
                #page-index .entry-info a:hover { border-color: var(--grey-a); }
                    #page-index .entry-info a span { color: var(--grey-5); font-family: var(--ff-ui); font-size: var(--fs-article-3); }

    .link-icon::after { display: block; content: ""; background-image: var(--link-icon); border-radius: 2px; width: 16px; height: 16px; margin-inline: 2px; display: inline-block; vertical-align: sub; object-fit: contain; background-repeat: no-repeat; background-size: contain; background-position: center; }
    
    </style>
</head>
