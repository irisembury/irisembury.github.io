<!DOCTYPE html>
<html style="opacity:0">
<head>
    <style>
    .profile-top { line-height: 1.3; display: flex; justify-content: center; align-items: center; gap: 17px; padding: 8px;  }
        .profile-img { background-image: url(assets/pfpx.jpg); background-size: contain; width: 150px; height: 180px; aspect-ratio: 5 / 6; background-color: grey; border: 1px solid var(--grey-9); }
        .profile-top p { font: 15px 'Roboto','Arial',sans-serif; margin: 0.5em 1em; }
    
    #container > section { display: none; margin-top: 20px; }
        .tabs { font: 17px 'Roboto','Arial',sans-serif; border-bottom: 1px solid var(--grey-c); padding-bottom: 2px; display: flex; align-items: flex-start; justify-content: center; gap: 20px; }
            .tab { color: var(--grey-5); text-align: center; padding: 4px 5px; }
                .dummy { width: 100%; font-weight: 700; visibility: hidden; height: 0; }
        #container.home .home, #container.videos .videos, #container.text .text { display: block; }
        #container.home .tab.home, #container.videos .tab.videos, #container.text .tab.text { color: var(--grey-2); font-weight: 700; }
        
        
            .links-panel { line-height: 1; display: flex; flex-wrap: wrap; justify-content: center; gap: 0.65em 1em; max-width: 700px; padding: 0 45px; margin-inline: auto; }
            .links-panel a { font-size: 17px; text-decoration: none; border-radius: 4px; display: flex; align-items: center; cursor: pointer; border: 1px solid var(--grey-c); padding: 6px 9px 6px 2px; }
            .links-panel a:hover { text-decoration: none; border-color: var(--grey-9); }
                .links-panel a .inline-icon { margin-inline: 5px; width: 18px; height: 18px; }
        .videos p { font: 15px/1.4 'Roboto','Arial',sans-serif; color: var(--grey-6); text-align: center; margin-block: 18px; }
            .article .text-index > div { padding: 12px 14px; }
                .article .text-index .entry-title { font-family: 'Faculty Glyphic',sans-serif; }
                .article .text-index .meta-row { color: var(--grey-3); display: flex; gap: 10px; margin-top: 2px; margin-left: 1px; }
                    .article .text-index .entry-date {  }
                    .article .text-index .entry-mirrors .link-text { display: none; }
        .article .video-index { display: grid; gap: 8px; grid-template-columns: repeat(4, 1fr); font-family: system-ui; }
            .article .video-index figure { max-width: 300px; display: flex; flex-direction: column; align-items: stretch; }
                .article .video-index img { width: 100%; height: 100%; box-sizing: border-box; border: 1px solid var(--grey-c); object-fit: cover; }
                .article .video-index .timecard { width: calc(100% - 2px); margin-inline: auto; text-align: right; height: 18px; margin-bottom: -18px; transform: translate(-2px,-21px); line-height: 1; display: flex; justify-content: flex-end; }
                    .article .video-index .timecard div { border-radius: 4px; color: #ccc; background-color: #0009; padding: 1px 4px; font-size: 14px; }
                .article .video-index figcaption { line-height: 1.1 !important; font: 17px 'Roboto','Arial',sans-serif; padding: 5px 3px; }
                    .article .video-index figcaption > div + div { margin-top: 0.25em; }
                    .article .video-index .video-title { color: var(--grey-2); }
                    .article .video-index .video-date { color: var(--grey-8); font-style: italic; }
        .article .text-index { font: 17px/1.3 'Roboto','Arial',sans-serif; display: grid; justify-content: center; }
    </style>
</head>
<body>

<div class="profile-top">
    <div class="profile-img"></div>
    <div>
        <h1 style="font-style:italic;font-size:34px;font-family:'Lora','Georgia',sans-serif;">Iris Embury</h1>
        <p> person from Ottawa Canada doing stuff</p>
    </div>
</div>
<div id="container" class="home">
    <div class="tabs">
        <div class="no-select pseudo-link home tab" onclick="setTab('home')"><div>About</div></div>
        <div class="no-select pseudo-link text tab" onclick="setTab('text')"><div>Text</div></div>
        <div class="no-select pseudo-link videos tab" onclick="setTab('videos')"><div>Videos</div></div>
    </div>
    <section class="videos">
        <p>I use Patreon as an alternate content host. The content there is not paywalled.</p>
        <div class="video-index"></div>
    </section>
    <section class="text">
        <div class="text-index label-external"></div>
    </section>
    <section class="home">
        <div class="links-panel label-external">
            <a href="https://youtube.com/channel/UCXadODjAtT72eYW6xCGyuUA/videos"><span class="youtube-logo inline-icon"></span><span>YouTube</span></a>
            <a href="https://twitter.com/irisembury"><span class="twitter-logo inline-icon"></span><span>Twitter/X</span></a>
            <a href="https://irisembury.github.io/discord"><span class="discord-logo inline-icon"></span><span>Discord server</span></a>
            <a href="https://patreon.com/irisembury"><span class="patreon-logo inline-icon"></span><span>Patreon</span></a>
            <a href="https://irisembury.tumblr.com/"><span class="tumblr-logo inline-icon"></span><span>Tumblr</span></a>
            <a href="https://bsky.app/profile/irisembury.bsky.social"><span class="bluesky-logo inline-icon"></span><span>Bluesky</span></a>
            <a href="https://irisembury.substack.com/archive"><span class="substack-logo inline-icon"></span><span>Substack</span></a>
            <a href="https://github.com/irisembury/irisembury.github.io"><span class="github-logo inline-icon"></span><span>This site on GitHub</span></a>
        </div>

<div class="space-evenly margin-top-em">
    <div>
        <div></div>
        <div></div>
    </div>
</div>





</section>
</div>

<script src="assets/layout.js"></script>
<script>
function setTab(x) {
    document.getElementById('container').className = x;
}
Array.from(document.querySelectorAll('.dummy')).forEach(x => x.innerHTML = x.previousElementSibling.innerHTML);
</script>
</body></html>
