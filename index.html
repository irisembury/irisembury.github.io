<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="assets/main.css">
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <style>
    
    html.indent-text .article .auto-list p { text-indent: 0 !important; }
    
    .article a { text-decoration: none; }
    .article h1 { margin: 0 !important; font-size: 32px; font-family: 'Lora','Georgia','Inter',sans-serif; text-align: center !important; }
    
    .video-index { display: grid; gap: 8px; grid-template-columns: repeat(4, 1fr); font-family: var(--ff-aux-2); margin-top: 10px !important; }
        .video-index :nth-child(n + 5) { display: none; }
        .video-index figure { max-width: 300px; display: flex; flex-direction: column; align-items: stretch; }
            .video-index img { box-sizing: border-box; border: 1px solid var(--theme-grey-c); aspect-ratio: 1.8; object-fit: cover; }
            .video-index img:hover { filter: brightness(1.05); }
            .video-index figcaption { text-align: center; padding: 3px; }
                .video-index figcaption .video-date { color: var(--theme-grey-6); }
    
    .page-index { display: grid; justify-content: center; gap: 20px; }
    .page-index * { line-height: 1.4 !important; }
        .page-index .date { color: var(--theme-grey-5); font-family: var(--ff-aux-1); font-size: calc(1em - 2px); }
        .mirrors { }
            .page-index .mirrors a { margin-left: 5px; padding-block: 1px 2px; border: 1px solid var(--theme-grey-d); border-radius: 3px; }
            .page-index .mirrors a:hover { background-color: var(--theme-grey-f); border-color: var(--theme-grey-a); }
                .page-index .mirrors a .link-text { display: none; }
    </style>
</head>
<body>
<h1>Recent videos</h1>
<div class="video-index"></div>
<div class="label-external" style="text-align:right"><a style="color:var(--theme-grey-5)" title="See all videos on YouTube" href="https://youtube.com/channel/UCXadODjAtT72eYW6xCGyuUA/videos">see all videos<span class="inline-icon link-icon"></span></a></div>
<h1>Text pages</h1>
<ul class="auto-list page-index"></ul>
<script src="assets/layout.js"></script>
</body></html>
