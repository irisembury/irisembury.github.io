<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="../../assets/main.css">
    <link rel="icon" type="image/x-icon" href="../../favicon.ico">
    <style>
        .c1::before {
            display: block;
            content: "";
            max-width: var(--main-width);
            border-left: var(--article-side-pad) solid var(--c3-bg);
            border-right: var(--article-side-pad) solid var(--c3-bg);
            aspect-ratio: 4 / 1;
            margin: 0 auto;
            background-image: url(../../assets/karl-friedrich-schinkel-landschaft-mit-pilger-1813.jpg);
            background-color: var(--c3-bg);
            background-size: cover;
            background-repeat: no-repeat;
            background-position: center;
        }
        
        #textInput { min-width: 50%; min-height: 3.5em; padding: 0.5em; }
        
    </style>
</head>
<body>

<div style="text-align:center">
    <div><textarea id="textInput" placeholder="..." maxlength="280"></textarea></div>
    <div>
        <input type="button" class="flat-button" onclick="postToX()" value="Post to X">
        <input type="button" class="flat-button" onclick="postToBluesky()" value="Post to Bluesky">
    </div>
</div>

<script src="../../assets/layout.js"></script>
<script>
function postToX() {
    const text = document.getElementById("textInput").value;
    const encoded = encodeURIComponent(text);
    const url = `https://twitter.com/intent/tweet?text=${encoded}`;
    window.open(url, "_blank");
}
function postToBluesky() {
    const text = document.getElementById("textInput").value;
    const encoded = encodeURIComponent(text);
    const url = `https://bsky.app/intent/compose?text=${encoded}`;
    window.open(url, "_blank");
}
</script>
</body></html>
